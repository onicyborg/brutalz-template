<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BRUTAL. — Template admin Neubrutalism berbasis Bootstrap 5.3.8. Komponen, form, tabel, dan halaman siap dikembangkan.">
  <title>Kesalahan server — BRUTAL.</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="bootstrap-5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/special.css">
</head>
<body data-page="errors-500" class="standalone-page">
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <div id="sidebar-root"></div>
  <button type="button" id="sidebarToggle" class="btn icon-btn standalone-toggle" aria-label="Buka navigasi" aria-controls="sidebar" aria-expanded="false">
    <svg class="icon" aria-hidden="true" viewbox="0 0 24 24">
      <path d="M3 6h18M3 12h18M3 18h18"></path>
    </svg>
  </button>
  <main id="main" class="special-error">
    <a class="brand" href="index.html">
      <span class="brand-mark bg-purple">b.</span>
      BRUTAL.
    </a>
    <div class="special-error-content">
      <svg class="error-art" viewbox="0 0 260 190" role="img" aria-label="Ilustrasi halaman 500" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="23" width="180" height="145" rx="9" fill="#232420"></rect>
        <rect x="26" y="10" width="180" height="145" rx="9" fill="#fffefb" stroke="#232420" stroke-width="5"></rect>
        <path d="M27 48h179" stroke="#232420" stroke-width="5"></path>
        <circle cx="49" cy="29" r="6" fill="#ffc7ad" stroke="#232420" stroke-width="3"></circle>
        <circle cx="70" cy="29" r="6" fill="#f9de6e" stroke="#232420" stroke-width="3"></circle>
        <path d="M88 83h54m-54 24h79" stroke="#232420" stroke-width="7" stroke-linecap="round"></path>
        <path d="m157 101 36 36m0-36-36 36" stroke="#7951ae" stroke-width="10" stroke-linecap="round"></path>
        <path d="M230 27v36m-18-18h36" stroke="#232420" stroke-width="6" stroke-linecap="round"></path>
      </svg>
      <span class="badge bg-purple">ERROR 500</span>
      <div class="error-code">500</div>
      <h1>Ada kendala di server.</h1>
      <p>Sesuatu terhenti di belakang layar. Coba kembali beberapa saat lagi.</p>
      <div class="special-error-actions">
        <a class="btn btn-primary" href="index.html">Kembali ke dashboard ↗</a>
        <button class="btn" type="button" onclick="history.back()">Halaman sebelumnya</button>
      </div>
    </div>
    <p class="small text-muted">© 2026 BRUTAL. · Halaman status demonstrasi.</p>
  </main>
  <div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="searchTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="searchTitle">Cari di BRUTAL.</h2>
          <button class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body">
          <label class="visually-hidden" for="globalSearch">Cari halaman</label>
          <input id="globalSearch" type="search" class="form-control" placeholder="Cari komponen, form, halaman…" autocomplete="off">
          <div id="searchResults" class="search-results mt-3"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="projectTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="projectTitle">Ide besar dimulai di sini.</h2>
          <button class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <form id="projectForm">
          <div class="modal-body">
            <p class="text-muted small">Tambahkan proyek ke workspace demo kamu.</p>
            <label class="form-label" for="projectName">Nama proyek</label>
            <input class="form-control mb-3" id="projectName" name="name" placeholder="Contoh: Website studio" required="" maxlength="70">
            <label class="form-label" for="projectCategory">Kategori</label>
            <select id="projectCategory" name="category" class="form-select mb-3">
              <option>Website</option>
              <option>Branding</option>
              <option>Mobile app</option>
              <option>Marketing</option>
            </select>
            <label class="form-label" for="projectDue">Tenggat</label>
            <input id="projectDue" name="due" class="form-control" type="date" required="">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn" data-bs-dismiss="modal">Batal</button>
            <button type="submit" class="btn btn-primary">
              <svg class="icon" aria-hidden="true" viewbox="0 0 24 24">
                <path d="M12 5v14M5 12h14"></path>
              </svg>
              Buat proyek
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div id="toastMessage" class="toast-body"></div>
        <button class="btn-close me-3 m-auto" data-bs-dismiss="toast" aria-label="Tutup"></button>
      </div>
    </div>
  </div>
  <script src="bootstrap-5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/sidebar-config.js"></script>
  <script src="assets/js/sidebar-icons.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/special.js"></script>
</body>
</html>
